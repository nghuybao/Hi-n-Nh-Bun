<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kiểm tra bảo mật</title>
  <style>
    :root { --bg: #FBF4E6; --card: #FFFBF2; --ink: #4B3A2C; --ok: #6F8762; --bad: #C0483E; --muted: #8F7B66; }
    body { margin: 0; padding: 24px 16px; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, 'Segoe UI', sans-serif; }
    main { max-width: 760px; margin: 0 auto; }
    h1 { font-size: 22px; margin: 0 0 6px; }
    p { margin: 0 0 14px; color: var(--muted); }
    button { padding: 10px 16px; border: 0; border-radius: 12px; background: #DC8E43; color: #fff; font-weight: 700; cursor: pointer; }
    table { width: 100%; margin-top: 16px; border-collapse: collapse; background: var(--card); border-radius: 14px; overflow: hidden; }
    td { padding: 8px 12px; border-bottom: 1px solid #E8DAC1; vertical-align: top; font-size: 14px; }
    td:nth-child(2) { font-weight: 700; white-space: nowrap; }
    .PASS { color: var(--ok); } .FAIL { color: var(--bad); } .SKIP { color: var(--muted); }
    small { color: var(--muted); word-break: break-word; }
  </style>
</head>
<body>
<main>
  <h1>Kiểm tra bảo mật Hiên Nhà Bun</h1>
  <p>Trang kiểm thử dành cho nhà phát triển, chạy trên máy (không được triển khai lên Vercel). Đăng nhập vào ứng dụng ở cùng địa chỉ trước, rồi mở trang này. Các phép thử chỉ đọc, hoặc thử những thao tác lẽ ra phải bị chặn; không thay đổi dữ liệu của bạn.</p>
  <button id="run">Chạy kiểm tra</button>
  <table><tbody id="out"></tbody></table>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js" integrity="sha384-TcHRA3zBbn+Lexh5n+Oil4guNPOS3rjNDpGRAN46u/s/mB2IZ50ceC6TYDU2yvgK" crossorigin="anonymous"></script>
<script>
(function () {
  const out = document.getElementById('out');
  const row = (name, res, detail) => { const tr = document.createElement('tr'); tr.innerHTML = `<td>${name}</td><td class="${res}">${res}</td><td><small></small></td>`; tr.querySelector('small').textContent = detail || ''; out.appendChild(tr); };
  const rlsDenied = (e) => !!e && (e.code === '42501' || /row-level security|permission denied/i.test(e.message || ''));
  function roleOf(tok) { try { return JSON.parse(atob(tok.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))).role; } catch (e) { return null; } }

  async function secretScan(cfg) {
    const html = await (await fetch('../index.html', { cache: 'no-store' })).text();
    const srcs = Array.from(html.matchAll(/<script src="(js\/[^"]+)"/g)).map((m) => '../' + m[1]);
    let bad = [];
    for (const s of srcs.concat(['../index.html'])) {
      const t = await (await fetch(s, { cache: 'no-store' })).text();
      if (/sb_secret_[A-Za-z0-9]/.test(t)) bad.push(s + ': sb_secret_');
      for (const m of t.matchAll(/eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}/g)) if (roleOf(m[0]) === 'service_role') bad.push(s + ': JWT service_role');
    }
    row('Không có khóa bí mật trong mã trình duyệt (' + srcs.length + ' tệp JS + index.html)', bad.length ? 'FAIL' : 'PASS', bad.join('; ') || 'không tìm thấy');
    if (cfg) row('Khóa trả về từ /api/config là khóa công khai', /^sb_secret_/.test(cfg.key) || roleOf(cfg.key) === 'service_role' ? 'FAIL' : 'PASS', cfg.key.slice(0, 14) + '…');
  }

  async function run() {
    out.innerHTML = '';
    let cfg = null;
    try { const r = await fetch('../api/config', { cache: 'no-store' }); const j = await r.json(); if (j.url && j.key) cfg = j; } catch (e) { /* bỏ qua */ }
    await secretScan(cfg);
    if (!cfg || cfg.mock) { row('Kiểm tra RLS qua API', 'SKIP', 'Chưa cấu hình dự án Supabase thật trong config.local.json.'); return; }

    // 1. Người chưa đăng nhập
    const anon = supabase.createClient(cfg.url, cfg.key, { auth: { persistSession: false, autoRefreshToken: false } });
    let r = await anon.from('game_saves').select('user_id');
    row('Chưa đăng nhập: không đọc được game_saves', r.error || (r.data || []).length === 0 ? 'PASS' : 'FAIL', r.error ? r.error.message : `${(r.data || []).length} dòng`);
    r = await anon.from('coin_events').select('user_id');
    row('Chưa đăng nhập: không đọc được sổ xu', r.error || (r.data || []).length === 0 ? 'PASS' : 'FAIL', r.error ? r.error.message : `${(r.data || []).length} dòng`);
    r = await anon.rpc('save_game', { p_base_rev: 1, p_sections: {}, p_events: [], p_device: 'test' });
    row('Chưa đăng nhập: không gọi được save_game', r.error ? 'PASS' : 'FAIL', r.error ? r.error.message : 'gọi được');
    r = await anon.storage.from('photos').list('00000000-0000-0000-0000-000000000000');
    row('Chưa đăng nhập: không liệt kê được ảnh', r.error || (r.data || []).length === 0 ? 'PASS' : 'FAIL', r.error ? r.error.message : `${(r.data || []).length} tệp`);

    // 2. Người đã đăng nhập (dùng phiên của ứng dụng ở cùng địa chỉ)
    const me = supabase.createClient(cfg.url, cfg.key, { auth: { storageKey: 'hien-nha-bun-auth', persistSession: true, autoRefreshToken: true, detectSessionInUrl: false } });
    const s = (await me.auth.getSession()).data.session;
    if (!s) { row('Kiểm tra khi đã đăng nhập', 'SKIP', 'Hãy đăng nhập vào ứng dụng ở cùng địa chỉ rồi chạy lại.'); return; }
    const uid = s.user.id, other = crypto.randomUUID();
    r = await me.from('game_saves').select('user_id');
    const foreign = (r.data || []).filter((x) => x.user_id !== uid).length;
    row('Đã đăng nhập: chỉ thấy bản lưu của mình', !r.error && foreign === 0 ? 'PASS' : 'FAIL', r.error ? r.error.message : `${(r.data || []).length} dòng, của người khác: ${foreign}`);
    r = await me.from('coin_events').select('user_id').neq('user_id', uid);
    row('Đã đăng nhập: không thấy sổ xu của người khác', !r.error && (r.data || []).length === 0 ? 'PASS' : 'FAIL', r.error ? r.error.message : `${(r.data || []).length} dòng`);
    r = await me.from('game_sections').insert({ user_id: other, section: 'misc', data: {}, rev: 1 });
    row('Không ghi được dữ liệu mang user_id của người khác', rlsDenied(r.error) ? 'PASS' : 'FAIL', r.error ? `${r.error.code} ${r.error.message}` : 'ghi được');
    r = await me.from('coin_events').insert({ user_id: other, event_id: 'sec-test', amount: 1, kind: 'earn' });
    row('Không ghi được vào sổ xu của người khác', rlsDenied(r.error) ? 'PASS' : 'FAIL', r.error ? `${r.error.code} ${r.error.message}` : 'ghi được');
    r = await me.from('coin_events').update({ amount: 99999 }).eq('user_id', uid).select('id');
    row('Không sửa được sổ xu (kể cả của mình)', r.error || (r.data || []).length === 0 ? 'PASS' : 'FAIL', r.error ? `${r.error.code} ${r.error.message}` : `sửa ${(r.data || []).length} dòng`);
    r = await me.from('game_saves').delete().eq('user_id', uid).select('user_id');
    row('Không xóa được bản lưu qua API', r.error || (r.data || []).length === 0 ? 'PASS' : 'FAIL', r.error ? `${r.error.code} ${r.error.message}` : `xóa ${(r.data || []).length} dòng`);
    r = await me.rpc('save_game', { p_base_rev: -1, p_sections: {}, p_events: [], p_device: 'sec-test' });
    row('save_game với phiên bản sai bị từ chối (không ghi đè)', r.error && /conflict|no_save/.test(r.error.message) ? 'PASS' : 'FAIL', r.error ? r.error.message : 'không báo lỗi');
    r = await me.storage.from('photos').upload(`${other}/sec-test.jpg`, new Blob(['x'], { type: 'image/jpeg' }));
    row('Không tải ảnh vào thư mục người khác', r.error ? 'PASS' : 'FAIL', r.error ? r.error.message : 'tải được');
    r = await me.storage.from('photos').list(other);
    row('Không xem được thư mục ảnh người khác', !r.error && (r.data || []).length === 0 ? 'PASS' : r.error ? 'PASS' : 'FAIL', r.error ? r.error.message : `${(r.data || []).length} tệp`);
    const k = Object.keys(localStorage).filter((x) => /service_role|sb_secret/i.test(localStorage.getItem(x) || ''));
    row('Bộ nhớ trình duyệt không chứa khóa bí mật', k.length ? 'FAIL' : 'PASS', k.join(', ') || 'sạch');
  }
  document.getElementById('run').addEventListener('click', () => run().catch((e) => row('Lỗi khi chạy', 'FAIL', e.message)));
})();
</script>
</body>
</html>
