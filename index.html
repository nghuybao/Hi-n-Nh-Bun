<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#6B4A32">
  <title>Hiên Nhà Bun</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='-58 -92 116 140'%3E%3Cpath d='M-36,-14 C-51,-40 -51,-70 -41,-86 C-26,-79 -10,-57 -6,-34Z M36,-14 C51,-40 51,-70 41,-86 C26,-79 10,-57 6,-34Z' fill='%23DC8E43'/%3E%3Cpath d='M-46,-4 C-46,-34 -24,-44 0,-44 C24,-44 46,-34 46,-4 C46,18 30,36 0,36 C-30,36 -46,18 -46,-4Z' fill='%23DC8E43'/%3E%3Cpath d='M-5,-43.5 C-6,-26 -9,-14 -20,-2 C-32,10 -28,30 0,36 C28,30 32,10 20,-2 C9,-14 6,-26 5,-43.5Z' fill='%23FFF9EE'/%3E%3Ccircle cx='-20' cy='-8' r='5.6' fill='%233B2A22'/%3E%3Ccircle cx='20' cy='-8' r='5.6' fill='%233B2A22'/%3E%3Cellipse cx='0' cy='7' rx='8' ry='6' fill='%232C2422'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Phông chữ tải thêm nếu có mạng; không có mạng thì dùng phông sẵn của máy -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Quicksand:wght@500;600;700&display=swap" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <main id="world" aria-label="Căn nhà của Bun">
      <div id="scene">
        <svg id="svgBg" aria-hidden="true"></svg>
        <svg id="svgActors" role="img" aria-label="Bun trong căn phòng. Bấm vào Bun để vuốt ve, bấm xuống sàn để gọi Bun lại."></svg>
        <svg id="svgMul" aria-hidden="true"></svg>
        <svg id="svgGlow" aria-hidden="true"></svg>
        <div class="grain"></div>
        <div class="vignette"></div>
      </div>
      <div id="bubble" role="status" aria-live="polite"></div>

      <div class="hud hud-tl">
        <button id="btnProfile" class="nameplate" aria-label="Hồ sơ của Bun"></button>
        <div id="stats" class="stats"></div>
        <div id="skyChip" class="sky-chip"></div>
        <button id="weightChip" class="sky-chip weight-chip" title="Thể trạng của Bun"></button>
      </div>
      <div class="hud hud-tr">
        <div class="chip" id="chipCoins" title="Xu"></div>
        <div class="chip" id="chipStreak" title="Chuỗi ngày"></div>
        <button class="round" id="btnShop" aria-label="Cửa tiệm" title="Cửa tiệm"></button>
        <button class="round" id="btnRoom" aria-label="Sắp xếp phòng" title="Sắp xếp phòng"></button>
        <button class="round" id="btnAudio" aria-label="Âm thanh" title="Âm thanh"></button>
        <button class="round" id="btnHealth" aria-label="Sổ sức khỏe" title="Sổ sức khỏe"></button>
        <button class="round" id="btnPhotos" aria-label="Tường ảnh" title="Tường ảnh"></button>
        <button class="round" id="btnJournal" aria-label="Nhật ký của Bun" title="Nhật ký của Bun"></button>
        <button class="round" id="btnSettings" aria-label="Cài đặt" title="Cài đặt"></button>
      </div>

      <div id="notice" class="notice" hidden></div>
      <div id="focusBar" class="focus-bar" hidden></div>
      <div id="miniPlayer" class="mini-player" hidden></div>
      <div id="popover" class="popover" hidden></div>
      <div class="hud hud-bottom" id="actions" role="toolbar" aria-label="Chăm sóc Bun"></div>
    </main>

    <aside id="panel" aria-label="Sổ tay công việc">
      <header class="panel-head" id="panelHead"></header>
      <nav class="tabs" role="tablist">
        <button role="tab" data-tab="today" class="on" aria-selected="true">Hôm nay</button>
        <button role="tab" data-tab="tomorrow" aria-selected="false">Ngày mai</button>
        <button role="tab" data-tab="focus" aria-selected="false">Tập trung</button>
        <button role="tab" data-tab="journey" aria-selected="false">Hành trình</button>
      </nav>
      <section id="tab-today" class="tab on" role="tabpanel"></section>
      <section id="tab-tomorrow" class="tab" role="tabpanel"></section>
      <section id="tab-focus" class="tab" role="tabpanel"></section>
      <section id="tab-journey" class="tab" role="tabpanel"></section>
    </aside>
  </div>

  <div id="modalRoot"></div>
  <div id="toasts" aria-live="polite"></div>
  <input type="file" id="importFile" accept="application/json,.json" hidden>

  <script src="js/data.js"></script>
  <script src="js/art.js"></script>
  <script src="js/state.js"></script>
  <script src="js/tasks.js"></script>
  <script src="js/plan.js"></script>
  <script src="js/care.js"></script>
  <script src="js/pets.js"></script>
  <script src="js/photos.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/scene.js"></script>
  <script src="js/bun.js"></script>
  <script src="js/friends.js"></script>
  <script src="js/planui.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/worldui.js"></script>
  <script src="js/focusui.js"></script>
  <script src="js/walk.js"></script>
  <script src="js/room.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
